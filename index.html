<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<form method="post" action="https://api.casp.dev/upload.php" enctype="multipart/form-data">
  <p><input type="text" name="name" placeholder="App name" required></p>
  <p>.p12 <input type="file" name="p12" required></p>
  <p>.mobileprovision <input type="file" name="mobileprovision" required></p>
  <p>.ipa <input type="file" name="ipa" required></p>
  <p><input type="password" name="pass" placeholder="Certificate password" required></p>
  <p><input type="submit" value="SIGN"></p>
</form>
